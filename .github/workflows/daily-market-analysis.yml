name: Daily Indian Stock Market Analysis Pipeline

on:
  schedule:
    # Runs Monday through Friday at 11:30 UTC (17:00 IST, after market close)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      analysis_date:
        description: 'Target Analysis Date (YYYY-MM-DD)'
        required: false
        default: ''
      force_run:
        description: 'Force run even if weekend or holiday'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-daily-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas scikit-learn pyarrow pytest

      - name: Run Market Analysis Pipeline
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.analysis_date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.analysis_date }}"
          fi
          FORCE_ARG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          PYTHONPATH=. python3 src/pipeline/daily_pipeline.py $DATE_ARG $FORCE_ARG

      - name: Execute Automated Tests
        run: |
          PYTHONPATH=. pytest tests/ -v

      - name: Commit and Push Generated Artifacts
        run: |
          PYTHONPATH=. python3 src/pipeline/git_commit.py
