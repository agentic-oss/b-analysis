name: Daily Indian Stock Market Data & Analysis Pipeline

on:
  schedule:
    # 11:30 UTC = 17:00 IST (5:00 PM IST, after market close) Monday through Friday
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date to analyze (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn pyarrow pytest pyyaml requests

      - name: Execute test suite
        run: |
          PYTHONPATH=. pytest tests/

      - name: Determine Target Analysis Date
        id: date_step
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            TARGET_DATE=$(date -u +'%Y-%m-%d')
          fi
          echo "target_date=$TARGET_DATE" >> $GITHUB_OUTPUT

      - name: Run Daily Stock Analysis Pipeline
        run: |
          PYTHONPATH=. python3 src/pipeline/daily_pipeline.py --date ${{ steps.date_step.outputs.target_date }}

      - name: Commit and push generated market data & reports
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ reports/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily Indian market analysis ${{ steps.date_step.outputs.target_date }}"
            git push
          fi
