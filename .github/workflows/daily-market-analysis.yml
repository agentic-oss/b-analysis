name: Daily Indian Market Analysis Pipeline

on:
  schedule:
    # Run daily at 12:30 UTC (18:00 IST) after Indian market close (15:30 IST)
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target analysis date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scikit-learn pyarrow pytest requests pyyaml

      - name: Run Pipeline Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Run Daily Pipeline Execution
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            PYTHONPATH=. python3 src/pipeline/daily_pipeline.py --date "${{ github.event.inputs.target_date }}"
          else
            PYTHONPATH=. python3 src/pipeline/daily_pipeline.py
          fi

      - name: Commit and Push Daily Analysis Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git status --porcelain | grep -q .; then
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "data: daily Indian market analysis ${TODAY}"
            git push
          else
            echo "No changes to commit."
          fi
