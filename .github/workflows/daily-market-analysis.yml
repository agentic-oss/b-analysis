name: Daily Indian Stock Market Analysis

on:
  schedule:
    # Run at 12:30 PM UTC (6:00 PM IST) Monday to Friday
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      analysis_date:
        description: 'Target Analysis Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  analyze-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn pyarrow pytest

      - name: Run Market Analysis Pipeline
        env:
          PYTHONPATH: .
        run: |
          if [ -n "${{ github.event.inputs.analysis_date }}" ]; then
            python src/pipeline/daily_pipeline.py --date "${{ github.event.inputs.analysis_date }}"
          else
            python src/pipeline/daily_pipeline.py
          fi

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/

      - name: Commit and Push Generated Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/git_commit.sh
          git push || echo "Nothing to push or no push permissions."
