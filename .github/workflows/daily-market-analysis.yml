name: Daily Indian Market Analysis Pipeline

on:
  schedule:
    # Runs at 12:00 UTC (5:30 PM IST) Monday through Friday
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Analysis Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn pyarrow pytest

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest tests/

      - name: Run Daily Pipeline
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            PYTHONPATH=. python3 src/pipeline/daily_pipeline.py --date "${{ github.event.inputs.target_date }}"
          else
            PYTHONPATH=. python3 src/pipeline/daily_pipeline.py
          fi

      - name: Commit and Push Generated Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ reports/

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "data: daily Indian market analysis ${TODAY}"
            git push
          fi
