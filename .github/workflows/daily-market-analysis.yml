name: Daily Indian Stock Market Analysis

on:
  schedule:
    # Run at 12:00 PM UTC (5:30 PM IST) on weekdays
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD)'
        required: false
        default: ''
      force_run:
        description: 'Force execution on holiday/weekend'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  analyze_market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn pyarrow pytest requests

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest tests/

      - name: Determine Target Date
        id: date_step
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            TARGET_DATE=$(date -u +'%Y-%m-%d')
          fi
          echo "target_date=${TARGET_DATE}" >> $GITHUB_OUTPUT

      - name: Run Daily Analysis Pipeline
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            EXTRA_ARGS="--force"
          fi
          PYTHONPATH=. python src/pipeline/daily_pipeline.py --date "${{ steps.date_step.outputs.target_date }}" --auto-commit $EXTRA_ARGS

      - name: Commit and Push Changes
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if ! git diff --staged --quiet; then
            git commit -m "data: daily Indian market analysis ${{ steps.date_step.outputs.target_date }}"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi
