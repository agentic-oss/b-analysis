name: Daily Indian Stock Market Analysis Pipeline

on:
  schedule:
    # Runs Monday through Friday at 12:30 UTC (18:00 IST) after market close
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD)'
        required: false
        default: ''
      force_run:
        description: 'Force run on scheduled holiday'
        required: false
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn pyarrow pytest

      - name: Execute Automated Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Run Market Data & Analysis Pipeline
        run: |
          DATE_FLAG=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            DATE_FLAG="--date ${{ github.event.inputs.target_date }}"
          fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          PYTHONPATH=. python3 src/pipeline/daily_pipeline.py $DATE_FLAG $FORCE_FLAG

      - name: Auto-commit Generated Market Reports and Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/git_auto_commit.py $(date +'%Y-%m-%d')
