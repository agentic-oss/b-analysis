name: Daily Indian Market Analysis Pipeline

on:
  schedule:
    # Run at 12:30 UTC (18:00 IST) on Monday through Friday
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Analysis Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn pyarrow pytest

      - name: Run Market Analysis Pipeline
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            TARGET_DATE=$(date +'%Y-%m-%d')
          fi
          echo "Running pipeline for date: $TARGET_DATE"
          PYTHONPATH=. python3 src/pipeline/daily_pipeline.py --date "$TARGET_DATE"

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest tests/

      - name: Commit and Push Generated Artifacts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            DATE_STR=$(date +'%Y-%m-%d')
            git commit -m "data: daily Indian market analysis $DATE_STR"
            git push
          fi
