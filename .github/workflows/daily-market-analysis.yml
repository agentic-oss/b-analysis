name: Daily Indian Market Analysis Pipeline

on:
  schedule:
    # Run every weekday (Mon-Fri) at 12:30 UTC (18:00 IST) after market close
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline
        run: |
          PYTHONPATH=. python3 src/pipeline/daily_pipeline.py ${{ github.event.inputs.target_date && format('--date {0}', github.event.inputs.target_date) || '' }}

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest tests/

      - name: Commit and Push Daily Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --staged --quiet; then
            echo "No new market data or reports to commit."
          else
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "data: daily Indian market analysis ${TODAY}"
            git push
          fi
