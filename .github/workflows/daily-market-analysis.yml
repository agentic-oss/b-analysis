name: Daily Indian Stock Market Analysis Pipeline

on:
  schedule:
    # Run every weekday at 11:30 UTC (17:00 IST - post market close)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Analysis Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  analyze-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas scikit-learn pyarrow pytest

      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Run Daily Analysis Pipeline
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            PYTHONPATH=. python3 src/pipeline/daily_pipeline.py --date "${{ github.event.inputs.target_date }}"
          else
            PYTHONPATH=. python3 src/pipeline/daily_pipeline.py
          fi

      - name: Commit and Push Generated Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily Indian market analysis $(date +'%Y-%m-%d')"
            git push
          fi
