name: Daily Indian Stock Market Analysis

on:
  schedule:
    # Run at 12:30 UTC (6:00 PM IST) on Monday, Tuesday, Wednesday, Thursday, Friday
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date for Analysis (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn pyarrow pytest requests tabulate pyyaml

      - name: Run Market Analysis Pipeline
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            TARGET_DATE=$(date +'%Y-%m-%d')
          fi
          echo "Running pipeline for date: $TARGET_DATE"
          PYTHONPATH=. python3 src/pipeline/daily_pipeline.py --date "$TARGET_DATE"

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest tests/

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/ data/analysis/ data/quality/
          if git diff --staged --quiet; then
            echo "No new market data or reports to commit."
          else
            git commit -m "data: daily Indian market analysis $(date +'%Y-%m-%d')"
            git push
          fi
