name: Daily Indian Stock Market Analysis

on:
  schedule:
    # Run daily at 12:30 UTC (18:00 IST) Monday to Friday
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target trading date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  analyze-market:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn pyarrow pytest

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest tests/

      - name: Execute Daily Market Analysis Pipeline
        run: |
          DATE_ARG="${{ github.event.inputs.target_date }}"
          if [ -n "$DATE_ARG" ]; then
            PYTHONPATH=. python3 src/pipeline/daily_pipeline.py --date "$DATE_ARG"
          else
            PYTHONPATH=. python3 src/pipeline/daily_pipeline.py
          fi

      - name: Commit and Push Generated Artifacts
        run: |
          python3 scripts/commit_results.py
