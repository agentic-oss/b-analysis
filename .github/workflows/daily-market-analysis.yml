name: Daily Indian Stock Market Analysis Pipeline

on:
  schedule:
    # Runs at 12:30 UTC (6:00 PM IST, after Indian markets close) on Mon, Tue, Wed, Thu, Fri
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Analysis Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  analyze-market:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn pyarrow pytest

      - name: Run Test Suite
        run: |
          python -m pytest tests/

      - name: Execute Daily Market Analysis Pipeline
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python -m src.pipeline.daily_pipeline --date "${{ github.event.inputs.target_date }}"
          else
            python -m src.pipeline.daily_pipeline
          fi

      - name: Commit and Push Updated Market Analysis Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: daily Indian market analysis $(date +'%Y-%m-%d')"
            git push
          fi
